<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Badgeline: design ID card templates, import an Excel/CSV list with photos, and export print-ready PDF, PNG or ZIP cards in bulk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='3' fill='%230F6B5C'/%3E%3Ccircle cx='11' cy='15' r='3' fill='white'/%3E%3Crect x='16' y='12' width='9' height='2' fill='white'/%3E%3Crect x='16' y='16' width='7' height='2' fill='white'/%3E%3C/svg%3E">
<title>Badgeline Card Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;800&family=Merriweather:wght@400;700;900&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout: workbench — nav rail at left (bottom tabs on phones), a step track across the top, work surface below. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --line:#D3DBD8; --line-2:#BCC7C3;
  --fg:#14201D; --muted:#5A6A65; --faint:#8A9893;
  --accent:#0F6B5C; --accent-fg:#FFFFFF; --accent-soft:#DCEDE8; --accent-ink:#0B4F44;
  --warn:#9A5A00; --warn-soft:#FBEED6; --err:#B3261E; --err-soft:#FBE3E1; --ok:#1C7139; --ok-soft:#DCF0E2;
  --stage:#E1E7E4; --stage-dot:#CAD3CF; --sel:#1A73E8;
  --shadow:0 1px 2px rgba(16,34,31,.06),0 4px 14px rgba(16,34,31,.07);
  --shadow-card:0 2px 6px rgba(16,34,31,.12),0 14px 40px rgba(16,34,31,.16);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3632; --line-2:#3A4843;
  --fg:#E5EEEA; --muted:#97A7A1; --faint:#6E7E78;
  --accent:#43B79E; --accent-fg:#05211B; --accent-soft:#163A33; --accent-ink:#7CD3BF;
  --warn:#EBAA4C; --warn-soft:#382811; --err:#F28A82; --err-soft:#3B1715; --ok:#6CCB8C; --ok-soft:#14301E;
  --stage:#0A0F0D; --stage-dot:#1C2522; --sel:#5EA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --shadow-card:0 2px 6px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3632; --line-2:#3A4843;
  --fg:#E5EEEA; --muted:#97A7A1; --faint:#6E7E78;
  --accent:#43B79E; --accent-fg:#05211B; --accent-soft:#163A33; --accent-ink:#7CD3BF;
  --warn:#EBAA4C; --warn-soft:#382811; --err:#F28A82; --err-soft:#3B1715; --ok:#6CCB8C; --ok-soft:#14301E;
  --stage:#0A0F0D; --stage-dot:#1C2522; --sel:#5EA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --shadow-card:0 2px 6px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.45);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
#root{height:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.15}
h2{font-size:18px;line-height:1.25}
h3{font-size:14px;line-height:1.3;font-family:var(--font-ui);font-weight:600}
p{margin:0}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* app frame */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:2px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:30px;height:20px;border-radius:4px;background:var(--accent);position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:12px;border-radius:2px;background:var(--accent-fg);opacity:.9}
.brand-mark::after{content:"";position:absolute;left:15px;top:6px;width:11px;height:2px;background:var(--accent-fg);box-shadow:0 4px 0 var(--accent-fg);opacity:.75}
.brand b{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:-.02em}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav-btn svg{flex:none}
.nav-foot{margin-top:auto;padding:12px 8px 0;font-size:11.5px;color:var(--faint);display:flex;flex-direction:column;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);min-height:56px;flex-wrap:wrap}
.content{flex:1;min-height:0;overflow:auto}
.page{padding-block:24px 48px;padding-inline:24px;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{margin-top:4px;color:var(--muted);max-width:64ch}

/* step track */
.steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.step{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 9px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.step:hover{background:var(--surface-2);color:var(--fg)}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line-2);font-variant-numeric:tabular-nums}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step.warn .n{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.step.cur{color:var(--fg);background:var(--surface-2)}
.step-sep{width:14px;height:1px;background:var(--line-2)}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.btn.danger.solid{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.lg{height:42px;padding:0 18px;font-size:15px;font-weight:600}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn.sm{width:26px;height:26px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11.5px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{height:32px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;width:100%;min-width:0}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;line-height:1.4}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.unit-inp{position:relative}
.unit-inp .inp{padding-right:30px}
.unit-inp em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--faint);pointer-events:none;font-family:var(--font-mono)}
.color-inp{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-sm);height:32px;padding:0 6px;background:var(--surface);min-width:0}
.color-inp input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color-inp input[type=text]{border:0;background:none;width:100%;min-width:0;font-family:var(--font-mono);font-size:12px;outline:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:none;padding:0 10px;height:30px;cursor:pointer;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.check{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.check input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;border:0}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(.96)}
.chip.img{background:var(--surface-2);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line, #d0d5dd);background:var(--surface, #fff);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner svg{flex:none;margin-top:1px}
.banner .grow{color:var(--fg)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .15s}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);transition:background .12s,border-color .12s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--fg)}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.hr{height:1px;background:var(--line);border:0;margin:0}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0 10px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbl td.rn,.tbl th.rn{width:56px;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;position:sticky;left:0;background:inherit}
.tbl tbody tr{background:var(--surface)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.has-err td.rn{color:var(--err);font-weight:600}
.tbl tr.has-warn td.rn{color:var(--warn);font-weight:600}
.tbl td.cell{cursor:text}
.tbl td.empty-cell{color:var(--faint);font-style:italic}
.tbl td input{width:100%;height:26px;border:1px solid var(--accent);border-radius:4px;padding:0 6px;background:var(--surface)}
.th-map{display:block;margin-top:3px;font-weight:500}

/* cards & tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tpl-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tpl-thumb{aspect-ratio:4/3;background:var(--stage);display:grid;place-items:center;padding:16px;max-width:100%;cursor:pointer;border:0;width:100%}
.tpl-thumb img{max-height:100%;max-width:100%;border-radius:5px;box-shadow:var(--shadow-card)}
.tpl-meta{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.tpl-meta .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardshadow{box-shadow:var(--shadow-card)}

/* dashboard */
.dash-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dstep{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0}
.dstep:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.dstep .t{display:flex;align-items:center;gap:8px;font-weight:600}
.dstep .d{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.dstep.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}

/* editor */
.editor{display:grid;grid-template-columns:248px minmax(0,1fr) 288px;height:100%;min-height:0}
.ed-side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ed-side.right{border-right:0;border-left:1px solid var(--line)}
.ed-scroll{overflow:auto;min-height:0;flex:1}
.ed-tabs{display:flex;border-bottom:1px solid var(--line)}
.ed-tabs button{flex:1;border:0;background:none;padding:10px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
.ed-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ed-center{display:flex;flex-direction:column;min-width:0;min-height:0}
.ed-toolbar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.tool{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:10.5px;padding:4px 7px;border-radius:var(--r-sm);min-width:46px}
.tool:hover{background:var(--surface-2);color:var(--fg)}
.tsep{width:1px;height:28px;background:var(--line);margin:0 4px}
.stage{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1px);background-size:16px 16px}
.stage-inner{min-width:100%;min-height:100%;display:grid;place-items:center;padding:24px}
.card-wrap{position:relative}
.card-wrap canvas{display:block;box-shadow:var(--shadow-card)}
.overlay{position:absolute;inset:0;touch-action:none;cursor:default}
.selframe{position:absolute;outline:1.5px solid var(--sel);pointer-events:none}
.selframe.locked{outline-style:dashed}
.hoverframe{position:absolute;outline:1px solid color-mix(in srgb,var(--sel) 60%,transparent);pointer-events:none}
.handle{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--sel);border-radius:2px;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
.rot-handle{position:absolute;left:50%;top:-26px;width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--sel);transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;touch-action:none}
.rot-stem{position:absolute;left:50%;top:-20px;height:20px;width:1.5px;background:var(--sel)}
.guide{position:absolute;background:#E8338A;pointer-events:none}
.ed-status{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);flex-wrap:wrap}
.sec{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec>h3{display:flex;align-items:center;justify-content:space-between}
.layer{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;min-width:0}
.layer:hover{background:var(--surface-2)}
.layer.sel{background:var(--accent-soft);color:var(--accent-ink)}
.layer .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer.dim .lname{opacity:.5}
.field-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.more>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
.more>summary::before{content:'+';display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--line-2);border-radius:4px;font-size:12px}
.more[open]>summary::before{content:'−'}
.more>summary::-webkit-details-marker{display:none}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:center;padding:16px;z-index:50}

.modal.narrow{width:min(440px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow-card);font-size:13px;display:flex;gap:10px;align-items:flex-start}

@media (max-width:1180px){
  .editor{grid-template-columns:220px minmax(0,1fr) 260px}

}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

  .brand,.nav-foot{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;flex:1 0 auto;align-items:center;min-width:60px}
  .main{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .banner .grow{flex-basis:200px}
  .page{padding-inline:16px}
  .topbar{padding:8px 16px}
  .editor{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}
  .ed-center{order:1;min-height:70vh}
  .ed-side.right{order:2;border-left:0;border-top:1px solid var(--line)}

  .dash-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}

}

/* ---- simple 3-step shell ---- */
.dthumb .zoom{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);opacity:0;transition:opacity .12s}

.dv{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-card);width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}

.dv-stage{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 16px;background:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1px);background-size:16px 16px;min-height:280px}
.dv-card{display:flex;justify-content:center;animation:dvIn .18s ease-out;min-width:0}

.shero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

.topnav{gap:8px}
.dlgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}

.shead-r{width:120px}

.sstep:hover{background:var(--surface-2);color:var(--fg)}
.sstep .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line-2)}
.sstep.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sstep[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink)}
.sstep[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.spage{max-width:1100px;gap:22px}
.shero h1{font-size:28px}
.shero p{margin-top:6px;color:var(--muted);font-size:15px;max-width:70ch}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
.selbar .grow{min-width:160px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
.dcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.dcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dthumb{height:176px;display:grid;place-items:center;background:var(--surface-2);border:0;cursor:pointer;padding:12px;position:relative}
.dthumb img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain}
.dmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.dname{font-weight:600;font-size:13.5px;line-height:1.3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.two.dl{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.num-badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-size:12px;margin-right:8px;vertical-align:2px}
.loaded{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2)}
.loaded.ok{background:var(--ok-soft);color:var(--ok)}
.loaded.ok b{color:inherit}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.adv summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;list-style:none;padding:12px 16px}
.adv summary::-webkit-details-marker{display:none}
details.adv:not(.panel) summary{padding:8px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 18px}
.mrow{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;font-weight:600}
.inp.bad{border-color:var(--warn)}
.stepnav{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.fmts{display:flex;flex-direction:column;gap:8px}
.fmt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.fmt input{margin-top:3px;accent-color:var(--accent)}
.fmt > span{display:flex;flex-direction:column;gap:2px}
.fmt.on{border-color:var(--accent);background:var(--accent-soft)}
.dlbtn{width:100%;justify-content:center;height:52px;font-size:16px}
.issues.sm{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
@media (max-width:900px){
  .two,.two.dl,.dlgrid{grid-template-columns:minmax(0,1fr)}
  .dlside{position:static}
  .shead{padding:8px 12px;gap:8px}
  .shead-r{display:none}
  .sbrand b{display:none}
  .app.simple .main{padding-bottom:0}
  .app.simple .toasts{bottom:16px}
}
@media (max-width:600px){
  .sstep .lbl{display:none}
  .sstep[aria-current="step"] .lbl{display:inline}
  .ssep{width:12px}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shero h1{font-size:23px}
}

<div id="root"><div style="padding:40px;font-family:system-ui;color:#5A6A65">Loading Badgeline…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
"use strict";
/* =====================================================================
   BADGELINE — ID card generation from spreadsheets
   Modules in this file (top to bottom):
   1. Utilities & units          5. Spreadsheet import
   2. Template model             6. Field mapping
   3. Rendering engine           7. Validation
   4. Image assets & photos      8. Generation & export
   9. Persistence (account db / browser IndexedDB / memory)
   10. App store                 11. UI components
   ===================================================================== */

/* ---------- 1. Utilities & units ---------- */
const PT_MM = 25.4 / 72;                       // 1 typographic point in mm
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r2 = v => Math.round(v * 100) / 100;
const fmt = (n, d = 1) => { const v = Math.round(n * 10 ** d) / 10 ** d; return Number.isFinite(v) ? String(v) : '0'; };
const mmToPx = (mm, dpi) => mm / 25.4 * dpi;
const yieldUI = () => new Promise(r => setTimeout(r, 0));
const cleanText = s => String(s ?? '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '').replace(/\r\n?/g, '\n');
const norm = s => String(s ?? '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ঀ-৿Ѐ-ӿ]+/g, '');
const keyify = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'field';
const sanitizeFilename = s => cleanText(s).replace(/[\\/:*?"<>|\n]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90);
const plural = (n, w, ws) => `${n.toLocaleString()} ${n === 1 ? w : (ws || w + 's')}`;
const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
const graphemes = s => segmenter ? Array.from(segmenter.segment(s), x => x.segment) : Array.from(s);
const lsGet = (k, d) => { try { const v = localStorage.getItem('badgeline:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('badgeline:' + k, JSON.stringify(v)); } catch {} };
const timeAgo = t => { if (!t) return ''; const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };

/* ---------- 2. Template model ---------- */
const FONTS = [
  { family: 'Poppins', weights: [400, 500, 600, 700, 800] },
  { family: 'Inter', weights: [400, 500, 600, 700, 800] },
  { family: 'Montserrat', weights: [400, 500, 600, 700, 800] },
  { family: 'Roboto', weights: [400, 500, 700, 900] },
  { family: 'Open Sans', weights: [400, 600, 700, 800] },
  { family: 'Lato', weights: [400, 700, 900] },
  { family: 'Oswald', weights: [400, 500, 600, 700] },
  { family: 'Barlow Condensed', weights: [400, 500, 600, 700] },
  { family: 'Playfair Display', weights: [400, 600, 700, 800] },
  { family: 'Merriweather', weights: [400, 700, 900] },
  { family: 'IBM Plex Mono', weights: [400, 500, 600, 700] },
  { family: 'IBM Plex Sans', weights: [400, 500, 600, 700] },
  { family: 'Hind Siliguri', weights: [400, 500, 600, 700] },
  { family: 'Noto Sans Bengali', weights: [400, 500, 600, 700] },
  { family: 'Noto Sans', weights: [400, 500, 600, 700] },
  { family: 'Great Vibes', weights: [400] },
];
const FONT_FALLBACK = '"Noto Sans", "Noto Sans Bengali", sans-serif';
const fontStr = (el, px) => `${el.italic ? 'italic ' : ''}${el.weight || 400} ${Math.max(0.5, px).toFixed(2)}px "${el.font || 'Poppins'}", ${FONT_FALLBACK}`;

const CARD_PRESETS = [
  { id: 'cr80p', label: 'CR80 portrait · 54 × 85.6 mm', w: 54, h: 85.6, radius: 3.18 },
  { id: 'cr80l', label: 'CR80 landscape · 85.6 × 54 mm', w: 85.6, h: 54, radius: 3.18 },
  { id: 'cr100p', label: 'CR100 portrait · 67 × 98.5 mm', w: 67, h: 98.5, radius: 3.18 },
  { id: 'cr100l', label: 'CR100 landscape · 98.5 × 67 mm', w: 98.5, h: 67, radius: 3.18 },
  { id: 'a7', label: 'A7 badge · 74 × 105 mm', w: 74, h: 105, radius: 0 },
  { id: 'a6', label: 'A6 event pass · 105 × 148 mm', w: 105, h: 148, radius: 0 },
  { id: 'us4x3', label: 'Badge 4 × 3 in · 101.6 × 76.2 mm', w: 101.6, h: 76.2, radius: 0 },
];

const F = (key, label, type = 'text', o = {}) => ({ key, label, type, required: false, unique: false, format: 'any', sample: '', ...o });
const DEFAULT_FIELDS = () => [
  F('name', 'Name', 'text', { required: true, sample: 'Jane Cooper' }),
  F('job_title', 'Job Title', 'text', { sample: 'Product Designer' }),
  F('employee_id', 'Employee ID', 'text', { required: true, unique: true, sample: 'EMP001' }),
  F('department', 'Department', 'text', { sample: 'Design' }),
  F('photo', 'Photo', 'image', { required: true }),
  F('email', 'Email', 'text', { format: 'email', sample: 'jane@company.com' }),
  F('phone', 'Phone', 'text', { format: 'phone', sample: '+1 555 0100' }),
];

/* What changes per person on an ID card, learned from a review of ~190 professional ID card designs (corporate, student,
   event and security cards). Everything not listed here (logo, company name, website, card title such as "STAFF PASS",
   the labels themselves, decorations, return address, rules) stays the same on every card.
   labels: how designs and spreadsheets name the field (English and Bangla); used to read uploaded PDFs, suggest
   spreadsheet columns and build label rows. */
const FIELD_KB = [
  { key: 'name', label: 'Name', group: 'Person', labels: ['name', 'full name', 'student name', 'employee name', 'staff name', 'member name', 'নাম'], sample: 'Jane Cooper' },
  { key: 'job_title', label: 'Job Title', group: 'Person', labels: ['designation', 'position', 'title', 'job title', 'role', 'post', 'পদবী', 'পদবি'], sample: 'Office Executive' },
  { key: 'department', label: 'Department', group: 'Person', labels: ['department', 'dept', 'division', 'unit', 'team', 'বিভাগ'], sample: 'Accounts' },
  { key: 'employee_id', label: 'ID No', group: 'Person', labels: ['id', 'id no', 'id number', 'id numb', 'id card', 'employee id', 'employee no', 'emp id', 'emp no', 'staff id', 'student id', 'member id', 'identity no', 'আইডি', 'আইডি নং', 'পরিচিতি নং'], sample: '201700201', unique: true, required: true },
  { key: 'phone', label: 'Phone', group: 'Contact', format: 'phone', labels: ['phone', 'mobile', 'mob', 'cell', 'contact', 'contact no', 'tel', 'telephone', 'মোবাইল', 'ফোন'], sample: '+880 1711-000000' },
  { key: 'email', label: 'Email', group: 'Contact', format: 'email', labels: ['email', 'e-mail', 'mail', 'email id', 'ইমেইল'], sample: 'name@company.com' },
  { key: 'social', label: 'Social', group: 'Contact', labels: ['social', 'social media', 'facebook', 'linkedin', 'instagram', 'twitter'], sample: '@username' },
  { key: 'address', label: 'Address', group: 'Contact', labels: ['address', 'home address', 'present address', 'permanent address', 'ঠিকানা'], sample: 'House 12, Road 5, Dhaka' },
  { key: 'emergency_contact', label: 'Emergency Contact', group: 'Contact', format: 'phone', labels: ['emergency', 'emergency contact', 'emergency no', 'in case of emergency', 'জরুরি যোগাযোগ'], sample: '+880 1811-000000' },
  { key: 'blood_group', label: 'Blood Group', group: 'Personal details', labels: ['blood', 'blood group', 'b group', 'রক্তের গ্রুপ'], sample: 'A+' },
  { key: 'dob', label: 'Date of Birth', group: 'Personal details', labels: ['dob', 'date of birth', 'birth date', 'জন্ম তারিখ'], sample: '15/06/1995' },
  { key: 'nid', label: 'NID', group: 'Personal details', labels: ['nid', 'nid no', 'national id', 'এনআইডি', 'জাতীয় পরিচয়পত্র নং'], sample: '1990123456789' },
  { key: 'father_name', label: "Father's Name", group: 'Personal details', labels: ["father's name", 'father name', 'father', 'পিতার নাম'], sample: 'Abdul Karim' },

  setP(0, 'Preparing');
  await AssetCache.ensure(tpl); await ensureFonts(tpl, uniqueChars(st.dataset.rows.flat()));
  const dpi = cfg.dpi; const s = dpi / 25.4;
  const c = document.createElement('canvas'); c.width = Math.round(tpl.card.w * s); c.height = Math.round(tpl.card.h * s);
  const ctx = c.getContext('2d');
  const base = { missingPhoto: st.settings.missingPhoto };
  const isJpg = cfg.format === 'zip-jpg' || cfg.format === 'single-jpg' || cfg.format.startsWith('pdf');
  const opts = { ...base, roundCorners: cfg.roundCorners && !cfg.format.startsWith('pdf'), matte: isJpg ? '#FFFFFF' : null };
  const stamp = new Date().toISOString().slice(0, 10);

  const twoSided = hasBack(tpl) && cfg.backSide !== false;

      else zip.file(`${nm}.${ext}`, blob);
      if (n % 3 === 2 || n === items.length - 1) { setP(n + 1, 'Rendering cards'); await yieldUI(); }
    }
    setP(items.length, 'Packing ZIP');
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => Store.set(s0 => ({ exportJob: { ...s0.exportJob, label: `Packing ZIP ${Math.round(m.percent)}%` } })));
    return { blob, filename: `${baseName}-${ext}.zip` };
  }

  let pdf, L;
  if (cfg.format === 'pdf-cards') pdf = new jsPDF({ unit: 'mm', format: [tpl.card.w, tpl.card.h], orientation: tpl.card.w > tpl.card.h ? 'landscape' : 'portrait', compress: true });
  else {
    L = sheetLayout(cfg, tpl.card);
    if (!L.fits || L.perPage < 1) throw new Error('The cards don\'t fit on the page with these settings. Reduce rows/columns, margins or spacing.');
    pdf = new jsPDF({ unit: 'mm', format: [L.pw, L.ph], orientation: L.pw > L.ph ? 'landscape' : 'portrait', compress: true });
  }
  const drawMarks = () => {
    if (!cfg.cropMarks) return;
    pdf.setDrawColor(40, 40, 40); pdf.setLineWidth(0.15);
    const xs = new Set(), ys = new Set();
    for (let col = 0; col < L.cols; col++) { const x = L.x0 + col * (L.cw + cfg.gapX); xs.add(r2(x)); xs.add(r2(x + L.cw)); }
    for (let row = 0; row < L.rows; row++) { const y = L.y0 + row * (L.ch + cfg.gapY); ys.add(r2(y)); ys.add(r2(y + L.ch)); }
    const top = L.y0, bottom = L.y0 + L.gridH, left = L.x0, right = L.x0 + L.gridW;
    const len = Math.min(5, Math.max(1.5, Math.min(top, L.ph - bottom, left, L.pw - right) - 1.5));
    if (len <= 0.5) return;
    xs.forEach(x => { pdf.line(x, top - 1.5 - len, x, top - 1.5); pdf.line(x, bottom + 1.5, x, bottom + 1.5 + len); });
    ys.forEach(y => { pdf.line(left - 1.5 - len, y, left - 1.5, y); pdf.line(right + 1.5, y, right + 1.5 + len, y); });

  const cutLine = p => { if (!cfg.cutLines) return; pdf.setDrawColor(150, 150, 150); pdf.setLineWidth(0.1); const rr = tpl.card.radius || 0; rr > 0 ? pdf.roundedRect(p.x, p.y, L.cw, L.ch, rr, rr, 'S') : pdf.rect(p.x, p.y, L.cw, L.ch, 'S'); };

  const backSlot = i => { const r = Math.floor(i / L.cols), col = i % L.cols; return cfg.flip === 'short' ? (L.rows - 1 - r) * L.cols + col : r * L.cols + (L.cols - 1 - col); };

    for (let n = 0; n < items.length; n++) {
      check(); await renderRow(items[n]);
      if (n > 0) pdf.addPage([tpl.card.w, tpl.card.h], cardOrient);
      pdf.addImage(c.toDataURL('image/jpeg', cfg.quality), 'JPEG', 0, 0, tpl.card.w, tpl.card.h, undefined, 'FAST');
      if (twoSided) { await renderRow(items[n], 'back'); pdf.addPage([tpl.card.w, tpl.card.h], cardOrient); pdf.addImage(c.toDataURL('image/jpeg', cfg.quality), 'JPEG', 0, 0, tpl.card.w, tpl.card.h, undefined, 'FAST'); }
      if (n % 3 === 2 || n === items.length - 1) { setP(n + 1, 'Rendering cards'); await yieldUI(); }
    }
  } else {
    const pageOrient = L.pw > L.ph ? 'landscape' : 'portrait';
    for (let start = 0, page = 0; start < items.length; start += L.perPage, page++) {
      const chunk = items.slice(start, start + L.perPage);

      for (let i = 0; i < chunk.length; i++) { check(); await renderRow(chunk[i]); const p = L.slots[i]; pdf.addImage(c.toDataURL('image/jpeg', cfg.quality), 'JPEG', p.x, p.y, L.cw, L.ch, undefined, 'FAST'); cutLine(p); if (i % 3 === 2) { setP(start + i + 1, 'Rendering fronts'); await yieldUI(); } }

        pdf.addPage([L.pw, L.ph], pageOrient);
        for (let i = 0; i < chunk.length; i++) { check(); await renderRow(chunk[i], 'back'); const p = L.slots[backSlot(i)]; pdf.addImage(c.toDataURL('image/jpeg', cfg.quality), 'JPEG', p.x, p.y, L.cw, L.ch, undefined, 'FAST'); cutLine(p); if (i % 3 === 2) { setP(start + i + 1, 'Rendering backs'); await yieldUI(); } }
        drawMarks();

  return { blob, filename: `${baseName}${cfg.format === 'pdf-cards' ? '-cards' : '-print-sheets'}.pdf` };
}
let downloadsNs;
async function saveFile(filename, blob) {
  if (downloadsNs === undefined) downloadsNs = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (!downloadsNs) { // standalone hosting (e.g. GitHub Pages): plain browser download
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); return { ok: true };
  }
  return downloadsNs.save({ filename, data: blob });
}
async function runExport(cfg, rows) {
  try {
    const { blob, filename } = await exportCards(cfg, rows);
    Store.set({ exportJob: { status: 'saving', label: 'Waiting for you to confirm the download' } });
    await saveFile(filename, blob);
    Store.set({ exportJob: { status: 'done', label: `Saved ${filename} (${(blob.size / 1048576).toFixed(1)} MB)` } });
    toast(`Saved ${filename}`);
  } catch (e) {
    if (e?.cancelled) { Store.set({ exportJob: { status: 'idle' } }); return; }
    const msg = e?.code === 'declined' ? 'Download cancelled.' : e?.code === 'rate_limited' ? 'A download prompt is already open. Finish it, then try again.' : e?.code === 'too_large' ? 'The file is too large for this destination. Export fewer cards or a lower resolution.' : (e?.message || 'Export failed.');
    Store.set({ exportJob: { status: 'error', label: msg } }); if (e?.code !== 'declined') toast(msg, 'err');

}

/* ---------- 9. Persistence ----------
   account: the artifact's private per-user store (data/users/<id>/...), synced across devices.
   browser: IndexedDB on this device.  memory: nothing is kept after closing. */
const Persist = {
  mode: 'connecting', col: null, idb: null, mem: { templates: new Map(), projects: new Map() }, knownAssets: new Map(),
  async init() {
    try {
      if (window.claude?.use) {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const id = user ? await user.id() : null;
        if (db && id) { this.col = db.collection('data/users/' + id); this.mode = 'account'; return; }
      }
    } catch (e) { console.warn('db unavailable', e); }
    try { this.idb = await this.openIdb(); this.mode = 'browser'; } catch { this.mode = 'memory'; }
  },
  openIdb() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const rq = indexedDB.open('badgeline', 1);
      rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('templates')) d.createObjectStore('templates', { keyPath: 'id' }); if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' }); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  },
  idbDo(store, mode, fn) { return new Promise((res, rej) => { const tx = this.idb.transaction(store, mode); const st = tx.objectStore(store); const rq = fn(st); tx.oncomplete = () => res(rq?.result); tx.onerror = () => rej(tx.error); }); },
  async retry(fn) { try { return await fn(); } catch (e) { if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } },
  summaryOf(t, thumb) { return { id: t.id, name: t.name, updatedAt: t.updatedAt, thumb: thumb ?? t.thumb ?? '', w: t.card.w, h: t.card.h, fieldCount: t.fields.length, elementCount: t.elements.length }; },

  async listTemplates() {
    if (this.mode === 'account') {
      const snap = await this.retry(() => this.col.where('kind', '==', 'template').get());
      return snap.docs.map(d => { const x = d.data(); this.knownAssets.set(x.id, x.assetIds || []); return { id: x.id, name: x.name, updatedAt: x.updatedAt, thumb: x.thumb, w: x.w, h: x.h, fieldCount: x.fieldCount, elementCount: x.elementCount }; });
    }
    if (this.mode === 'browser') { const all = await this.idbDo('templates', 'readonly', s => s.getAll()); return all.map(t => this.summaryOf(t)); }
    return [...this.mem.templates.values()].map(t => this.summaryOf(t));
  },
  async loadTemplate(id) {
    if (this.mode === 'account') {
      const d = await this.retry(() => this.col.doc('tpl_' + id).get()); if (!d.exists) return null;
      const x = d.data(); const t = JSON.parse(x.body); t.assets = {};
      for (const a of x.assetIds || []) { const s = await this.retry(() => this.col.doc('img_' + a).get()); if (s.exists) t.assets[a] = s.data().dataUrl; }
      this.knownAssets.set(id, x.assetIds || []); return t;
    }
    if (this.mode === 'browser') { const t = await this.idbDo('templates', 'readonly', s => s.get(id)); if (!t) return null; const { thumb, ...rest } = t; return rest; }
    const t = this.mem.templates.get(id); return t ? cloneTpl(t) : null;
  },
  async saveTemplate(tpl, thumb) {
    const t = pruneAssets(cloneTpl(tpl)); t.updatedAt = Date.now();
    if (this.mode === 'account') {
      const prev = this.knownAssets.get(t.id) || [];
      const ids = Object.keys(t.assets);
      for (const a of ids) if (!prev.includes(a)) await this.retry(() => this.col.doc('img_' + a).set({ kind: 'image', owner: t.id, dataUrl: t.assets[a] }));
      const { assets, ...rest } = t; const body = JSON.stringify(rest);
      if (body.length > 240000) throw new Error('This template has too many elements to save. Remove some and try again.');
      const s = this.summaryOf(t, thumb);
      await this.retry(() => this.col.doc('tpl_' + t.id).set({ kind: 'template', ...s, assetIds: ids, body }));
      for (const a of prev) if (!ids.includes(a)) await this.col.doc('img_' + a).delete().catch(() => {});
      this.knownAssets.set(t.id, ids); return s;
    }
    if (this.mode === 'browser') { await this.idbDo('templates', 'readwrite', s => s.put({ ...t, thumb })); return this.summaryOf(t, thumb); }
    this.mem.templates.set(t.id, { ...t, thumb }); return this.summaryOf(t, thumb);
  },
  async deleteTemplate(id) {
    if (this.mode === 'account') {
      const d = await this.col.doc('tpl_' + id).get(); const ids = d.exists ? (d.data().assetIds || []) : [];
      for (const a of ids) await this.col.doc('img_' + a).delete().catch(() => {});
      await this.retry(() => this.col.doc('tpl_' + id).delete()); this.knownAssets.delete(id); return;
    }
    if (this.mode === 'browser') return this.idbDo('templates', 'readwrite', s => s.delete(id));
    this.mem.templates.delete(id);
  },
  async listProjects() {
    if (this.mode === 'account') { const snap = await this.retry(() => this.col.where('kind', '==', 'project').get()); return snap.docs.map(d => { const { body, ...x } = d.data(); return x; }); }
    if (this.mode === 'browser') { const all = await this.idbDo('projects', 'readonly', s => s.getAll()); return all.map(({ body, ...x }) => x); }
    return [...this.mem.projects.values()].map(({ body, ...x }) => x);
  },
  async loadProject(id) {
    if (this.mode === 'account') { const d = await this.retry(() => this.col.doc('prj_' + id).get()); return d.exists ? { ...d.data(), body: JSON.parse(d.data().body) } : null; }
    if (this.mode === 'browser') return this.idbDo('projects', 'readonly', s => s.get(id));
    return this.mem.projects.get(id) || null;
  },
  async saveProject(p) {
    if (this.mode === 'account') {
      let body = JSON.stringify(p.body);
      if (body.length > 230000) { p = { ...p, rowsOmitted: true, body: { ...p.body, dataset: p.body.dataset ? { ...p.body.dataset, rows: [], lines: [] } : null } }; body = JSON.stringify(p.body); }
      await this.retry(() => this.col.doc('prj_' + p.id).set({ kind: 'project', ...p, body })); return p;
    }
    if (this.mode === 'browser') { await this.idbDo('projects', 'readwrite', s => s.put(p)); return p; }
    this.mem.projects.set(p.id, p); return p;
  },
  async deleteProject(id) {
    if (this.mode === 'account') return this.retry(() => this.col.doc('prj_' + id).delete());
    if (this.mode === 'browser') return this.idbDo('projects', 'readwrite', s => s.delete(id));
    this.mem.projects.delete(id);
  },
};

function usePhotoStats() {
  const pv = useS(s => s.photoVersion), ds = useS(s => s.dataset), tpl = useS(s => s.template), mapping = useS(s => s.mapping), fb = useS(s => s.photoFallback);
  return useMemo(() => {
    if (!ds || !tpl) return null; const keys = imageFieldKeys(tpl); if (!keys.length) return null;
    let found = 0, empty = 0, url = 0, missing = []; const usedBlobs = new Set();
    for (let i = 0; i < ds.rows.length; i++) for (const k of keys) {
      const r = photoFor(i, k);
      if (r.status === 'found') { found++; usedBlobs.add(r.entry.blob); } else if (r.status === 'empty') empty++; else if (r.status === 'url') { url++; missing.push({ i, ref: r.ref }); } else missing.push({ i, ref: r.ref || '' });
    }
    const unused = PhotoLib.entries.filter(e => !usedBlobs.has(e.blob)).length;
    return { found, empty, url, missing, total: ds.rows.length * keys.length, unused };
  }, [pv, ds, tpl, mapping, fb]);
}

// Rows copied from Excel or Google Sheets arrive as tab-separated text.
function pasteRows(text) {
  const st = S(); const ds = st.dataset; if (!ds) return 0;
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim()); if (!lines.length) return 0;
  let grid = lines.map(l => l.split('\t').map(v => cleanText(v).trim()));
  let order = ds.columns.map((_, i) => i);
  const head = grid[0].map(h => h.toLowerCase());
  const hits = head.filter(h => ds.columns.some(c => c.toLowerCase() === h)).length;
  if (hits >= Math.max(1, Math.ceil(head.length / 2))) { order = head.map(h => ds.columns.findIndex(c => c.toLowerCase() === h)); grid = grid.slice(1); }
  if (!grid.length) return 0;
  const add = grid.map(cells => { const r = ds.columns.map(() => ''); cells.forEach((v, j) => { const ci = order[j]; if (ci != null && ci >= 0 && ci < r.length) r[ci] = v; }); return r; });
  const keep = ds.rows.filter(r => r.some(v => v)); const keepLines = ds.lines.filter((_, i) => ds.rows[i].some(v => v));
  let last = keepLines[keepLines.length - 1] || ds.headerLine;
  Store.set({ dataset: { ...ds, rows: [...keep, ...add], lines: [...keepLines, ...add.map(() => ++last)], version: ds.version + 1 } }); touch();
  return add.length;
}

}

          ${size?.scaledFrom ? html`<p className="small" style=${{ color: 'var(--accent-ink)' }}>Your PDF is ${size.scaledFrom[0]} × ${size.scaledFrom[1]} mm, the same shape as a ${size.w} × ${size.h} mm card but larger (a 2×–4× export). It's scaled down to card size, text included.</p>` : null}
          <p className="tiny muted num">${info.kind === 'pdf' ? `PDF page ${fmt(info.mmW)} × ${fmt(info.mmH)} mm` : `Image ${info.pxW} × ${info.pxH} px`}${size ? ` · prints at about ${Math.round(info.w / (size.w / 25.4))} dpi` : ''}</p>
          ${size && info.w / (size.w / 25.4) < 200 ? html`<div className="banner warn"><${Icon} n="alert" /><div className="grow">This design is low resolution for this card size and may print soft. Export it at least ${Math.round(mmToPx(size.w, 300))} px wide if you can.</div></div>` : null}
          <button className="btn sm ghost" style=${{ alignSelf: 'flex-start' }} onClick=${() => { setInfo(null); setFile(null); }}>Choose a different file</button>
        </div></div>
      ${info.photo ? html`<div className="field-row"><div className="row nowrap"><${Icon} n="photo" /><h3 className="grow">Photo found in your PDF</h3></div>
        <${Check} checked=${usePhoto} onChange=${setUsePhoto}>Use this spot for each person's photo from the spreadsheet (the sample photo is removed)</${Check}></div>` : null}
      ${texts.length ? html`<div className="field-row" style=${{ gap: 10 }}>
          <div className="row"><h3 className="grow">Text found in your PDF (${texts.length})</h3><button className="btn sm ghost" onClick=${() => setAll('text')}>All editable</button><button className="btn sm ghost" onClick=${() => setAll('drop')}>Remove all</button></div>
          <p className="small muted">Every line becomes editable text on the card. Connect the lines that change per person (name, job title, ID…) to a data field, so each card fills them from the spreadsheet.</p>
          <div className="stack" style=${{ gap: 6, maxHeight: 300, overflow: 'auto' }}>${texts.map(t => html`<div key=${t.id} className="row nowrap" style=${{ gap: 8 }}>
            <span className="grow" style=${{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: t.weight >= 600 ? 600 : 400, color: choices[t.id] === 'drop' ? 'var(--faint)' : undefined, textDecoration: choices[t.id] === 'drop' ? 'line-through' : undefined }} title=${`${t.str} · ${t.fontName || t.family} ${fmt(t.size)} pt`.replace(/\n/g, ' ')}>
              <span style=${{ display: 'inline-block', width: 10, height: 10, borderRadius: 2, background: t.color, marginRight: 6, border: '1px solid var(--line-2)', verticalAlign: '-1px' }}></span>${t.str.replace(/\n/g, ' / ')}</span>
            ${t.removable === false ? html`<span className="pill warn" title="This line is drawn as shapes in the PDF, so it also stays in the background. Cover it in the editor.">In picture</span>` : null}
            <select className="inp" style=${{ width: 210, flex: 'none' }} aria-label=${'Use for ' + t.str.replace(/\n/g, ' ')} value=${choices[t.id] || 'text'} onChange=${e => setChoices({ ...choices, [t.id]: e.target.value })}>
              <option value="text">Fixed text (editable)</option>
              <optgroup label="Fill from spreadsheet">${fieldList.map(f => html`<option key=${f.key} value=${f.key}>Data field: ${f.label}</option>`)}</optgroup>
              <option value="drop">Remove from card</option></select></div>`)}</div>
          <p className="tiny muted">Fonts are matched to the closest available font. You can change any line afterwards in the editor.</p></div>`
        : html`<div className="banner warn"><${Icon} n="info" /><div className="grow">${info.kind === 'pdf' ? html`<b>No editable text in this PDF.</b> Its text was turned into shapes when it was exported (often called "outline text" or "flatten"). Re-export with live text to edit it here, or use <b>Cover</b> in the editor to hide old text and add data fields on top.` : html`<b>A picture has no editable text.</b> Upload a PDF to edit the text, or use <b>Cover</b> in the editor to hide old text and add data fields on top.`}</div></div>`}
    <//>`}
    ${err ? html`<div className="banner err"><${Icon} n="alert" /><div className="grow">${err}</div></div>` : null}
  <//>`;
}
function LeaveModal({ next, onClose }) {
  const ed = useS(s => s.editor);
  const proceed = () => { edOpen(next === 'new' ? newTemplate() : next); Store.set({ modal: null }); go('editor'); };
  return html`<${Modal} narrow title="Unsaved changes" onClose=${onClose} foot=${html`<${Fragment}><button className="btn" onClick=${() => { onClose(); go('editor'); }}>Keep editing</button><button className="btn danger" onClick=${proceed}>Discard changes</button><button className="btn primary" onClick=${async () => { if (await saveEditor()) proceed(); }}>Save and continue</button><//>`}>
    <p>"${ed?.draft.name}" has changes that aren't saved to your templates yet.</p><//>`;
}

/* ---------- Projects ---------- */
async function saveCurrentProject(name) {
  const st = S(); if (!st.template) throw new Error('Pick a template first.');
  if (!isSaved(st.template.id) || (st.editor?.draft.id === st.template.id && st.editor.dirty)) {
    const t = st.editor?.draft.id === st.template.id ? canonicalTpl(st.editor.draft) : st.template;
    await saveTemplateToLibrary(pruneAssets(cloneTpl(t))); if (st.editor?.draft.id === t.id) edPatch({ dirty: false });
  }
  const ds = st.dataset;
  const p = { id: st.project.id || uid('p'), name: name.trim() || 'Untitled project', updatedAt: Date.now(), templateId: st.template.id, templateName: st.template.name, rowCount: ds?.rows.length || 0, photoCount: PhotoLib.entries.length, fileName: ds?.fileName || '',
    body: { templateId: st.template.id, mapping: st.mapping, mappingAuto: st.mappingAuto, photoFallback: st.photoFallback, exportCfg: st.exportCfg, errorPolicy: st.errorPolicy, dataset: ds ? { fileName: ds.fileName, sheetName: ds.sheetName, sheetNames: [ds.sheetName], columns: ds.columns, rows: ds.rows, lines: ds.lines, headerLine: ds.headerLine, isExample: !!ds.isExample } : null } };
  const saved = await Persist.saveProject(p);
  Store.set({ project: { id: p.id, name: p.name } }); lsSet('lastProject', p.id); await refreshProjects();
  return saved;
}
async function openProject(id) {
  const p = await Persist.loadProject(id); if (!p) throw new Error('That project could not be found.');
  const b = p.body; const t = await Persist.loadTemplate(b.templateId);
  if (!t) throw new Error(`Its template "${p.templateName}" has been deleted.`);
  PhotoLib.clear(); GenStore.clear();
  const ds = b.dataset && b.dataset.rows.length ? { ...b.dataset, version: 1 } : null;
  Store.set({ template: t, dataset: ds, mapping: b.mapping || {}, mappingAuto: b.mappingAuto || {}, photoFallback: b.photoFallback || '', exportCfg: { ...defaultExportCfg(t.card), ...b.exportCfg }, errorPolicy: b.errorPolicy || 'skip', generation: null, validation: null, previewRow: 0, project: { id: p.id, name: p.name }, photoVersion: S().photoVersion + 1 });
  AssetCache.ensure(t); touch(); lsSet('lastProject', p.id);
  toast(p.rowsOmitted || !ds ? `Opened "${p.name}". Upload the spreadsheet again; it was too large to store with the project.` : p.photoCount ? `Opened "${p.name}". Add the ${p.photoCount} photo files again; photos aren't stored with projects.` : `Opened "${p.name}"`);
}
function ProjectsView() {
  const list = useS(s => s.projects); const project = useS(s => s.project); const tpl = useS(s => s.template); const ds = useS(s => s.dataset); const mode = useS(s => s.storageMode);
  const [name, setName] = useState(project.name); const [busy, setBusy] = useState(false);
  useEffect(() => setName(project.name), [project.name]);
  useEffect(() => { refreshProjects(); }, []);
  return html`<div className="page">
    <div className="page-head"><div><h1>Projects</h1><p>A project keeps one card run together: the template, the spreadsheet rows, the field connections and the export settings. Photos aren't stored; add them again when you reopen a project.</p></div></div>
    <section className="panel"><div className="panel-head"><h2>Current run</h2></div><div className="panel-body">
      <div className="row"><${Fld} label="Project name" style=${{ flex: '1 1 260px' }}><input className="inp" value=${name} onChange=${e => setName(e.target.value)} /><//>
        <button className="btn primary" style=${{ alignSelf: 'end' }} disabled=${busy || !tpl} onClick=${async () => { setBusy(true); try { await saveCurrentProject(name); toast('Project saved'); } catch (e) { toast('Saving the project failed: ' + (e.message || e.code), 'err'); } setBusy(false); }}><${Icon} n="save" />${project.id ? 'Save changes' : 'Save project'}</button></div>
      <p className="small muted">${tpl ? html`Template <b>${tpl.name}</b>` : 'No template'} · ${ds ? `${ds.fileName}, ${plural(ds.rows.length, 'row')}` : 'no data'}${mode === 'memory' ? ' · Storage is unavailable here, so projects last until you close the page.' : ''}</p>
    </div></section>
    <section className="stack" style=${{ gap: 12 }}><h2>Saved projects</h2>
      ${!list.length ? html`<div className="panel empty"><p>No saved projects yet.</p></div>` : html`<div className="panel">${list.map(p => html`<div key=${p.id} className="row" style=${{ padding: '12px 16px', borderBottom: '1px solid var(--line)' }}>
        <div className="grow" style=${{ minWidth: 200 }}><div style=${{ fontWeight: 600 }}>${p.name}${project.id === p.id ? html` <span className="pill acc">Open</span>` : null}</div><div className="small muted">${p.templateName} · ${p.fileName || 'no file'} · ${plural(p.rowCount || 0, 'row')} · ${timeAgo(p.updatedAt)}</div></div>
        <button className="btn sm" onClick=${async () => { try { await openProject(p.id); go('templates'); } catch (e) { toast(e.message, 'err'); } }}>Open</button>
        <${ConfirmBtn} label="" confirm="Delete project?" onConfirm=${async () => { await Persist.deleteProject(p.id); if (project.id === p.id) Store.set({ project: { id: null, name: project.name } }); refreshProjects(); }} /></div>`)}</div>`}
    </section></div>`;
}

/* ---------- Settings ---------- */
function SettingsView() {
  const st = useS(s => s.settings); const mode = useS(s => s.storageMode);
  const set = p => { const n = { ...S().settings, ...p }; Store.set({ settings: n }); lsSet('settings', n); if ('missingPhoto' in p) touch(); };
  return html`<div className="page" style=${{ maxWidth: 820 }}>
    <div className="page-head"><div><h1>Settings</h1><p>These preferences apply in this browser.</p></div></div>
    <section className="panel"><div className="panel-head"><h2>Storage</h2></div><div className="panel-body">
      <div className="row"><span className=${'dot ' + (mode === 'account' ? 'ok' : mode === 'memory' ? 'warn' : '')}></span><span>${{ account: 'Templates and projects are saved to your account and available on any device where you open this page.', browser: 'Templates and projects are saved in this browser only.', memory: "Storage isn't available here. Templates and projects last until you close the page; use Export on a template to keep a copy.", connecting: 'Connecting…' }[mode]}</span></div>
      <p className="small muted">Spreadsheets and photos are processed on your device and never uploaded. Logos and backgrounds are stored inside the template.</p></div></section>
    <section className="panel"><div className="panel-head"><h2>Editor</h2></div><div className="panel-body">
      <${Check} checked=${st.snapping} onChange=${v => set({ snapping: v })}>Snap to card edges, centre and other elements while dragging</${Check}>
      <${Check} checked=${st.previewWithData} onChange=${v => set({ previewWithData: v })}>Show spreadsheet data in the editor when data is loaded</${Check}>
      <${Fld} label="Arrow-key nudge" style=${{ maxWidth: 200 }}><${NumIn} value=${st.nudge} min=${0.05} max=${10} step=${0.1} unit="mm" onChange=${v => set({ nudge: v })} /><//>
    </div></section>
    <section className="panel"><div className="panel-head"><h2>Generated cards</h2></div><div className="panel-body">
      <${Fld} label="When a row has no photo"><${Seg} label="Missing photo" value=${st.missingPhoto} onChange=${v => set({ missingPhoto: v })} options=${[['placeholder', 'Show a placeholder silhouette'], ['blank', 'Leave the space empty']]} /><//>
      <p className="small muted">Rows with missing photos are always listed under Checks before you generate.</p>
    </div></section>
  </div>`;
}

/* ---------- boot ---------- */
(function boot() {
  const settings = { ...DEFAULT_SETTINGS, ...lsGet('settings', {}) };
  const tpl = starterTravel(); tpl.name = 'Skyline Travels staff ID (example)';
  const ds = exampleDataset(); const { map, auto } = suggestMapping(tpl.fields, ds.columns);
  Store.set({ route: 'templates', tick: 0, rev: 1, template: tpl, dataset: ds, mapping: map, mappingAuto: auto, photoFallback: '', photoVersion: 0,
    validation: null, generation: null, exportJob: { status: 'idle' }, exportCfg: defaultExportCfg(tpl.card), errorPolicy: 'skip', previewRow: 0, settings,
    templates: [], templatesLoaded: false, projects: [], storageMode: 'connecting', editor: null, toasts: [], modal: null, saving: false, project: { id: null, name: 'Skyline Travels staff cards' } });
  AssetCache.ensure(tpl);
  if (document.fonts) document.fonts.addEventListener('loadingdone', bumpTick);
  let lastRev = null;
  Store.sub(() => { const s = S(); if (s.rev !== lastRev) { lastRev = s.rev; if (s.dataset && s.template) scheduleValidation(); } });
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  makeExamplePhotos().then(() => { Store.set(s => ({ photoVersion: s.photoVersion + 1 })); touch(); });
  Persist.init().then(async () => { Store.set({ storageMode: Persist.mode }); await refreshTemplates(); refreshProjects(); });
  window.__badgeline = { Store, Render, PhotoLib, exportCards, generateCards, runValidation, parseSpreadsheetFile, setDataset, edOpen, Persist, STARTERS, sampleRecord };
})();
</script>
